services:
  # ──────────────────────────────────────────────
  # Application (PHP-FPM)
  # ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: school-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
    volumes:
      - app-storage:/var/www/html/storage/app
    networks:
      - school-network

  # ──────────────────────────────────────────────
  # Nginx (Web Server)
  # ──────────────────────────────────────────────
  nginx:
    build:
      context: docker/nginx
      dockerfile: Dockerfile
    container_name: school-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - app
    volumes:
      - ./public:/var/www/html/public:ro
    networks:
      - school-network

  # ──────────────────────────────────────────────
  # Scheduler (Laravel schedule:work)
  # ──────────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: school-scheduler
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work", "--verbose", "--no-interaction"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - school-network

  # ──────────────────────────────────────────────
  # Horizon (Queue Worker)
  # Enable after installing laravel/horizon (US-S0.2)
  # Start with: docker compose --profile horizon up -d
  # ──────────────────────────────────────────────
  horizon:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: school-horizon
    restart: unless-stopped
    command: ["php", "artisan", "horizon"]
    profiles:
      - horizon
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - school-network

  # ──────────────────────────────────────────────
  # PostgreSQL 16
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: school-postgres
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-school}
      POSTGRES_USER: ${DB_USERNAME:-school}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-school} -d ${DB_DATABASE:-school}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - school-network

  # ──────────────────────────────────────────────
  # Redis 7
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: school-redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-63790}:6379"
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-secret}"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - school-network

  # ──────────────────────────────────────────────
  # Meilisearch
  # ──────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: school-meilisearch
    restart: unless-stopped
    ports:
      - "${FORWARD_MEILISEARCH_PORT:-7700}:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-masterKey}
      MEILI_ENV: development
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - school-network

  # ──────────────────────────────────────────────
  # MinIO (S3-compatible storage)
  # ──────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: school-minio
    restart: unless-stopped
    ports:
      - "${FORWARD_MINIO_PORT:-9000}:9000"
      - "${FORWARD_MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - school-network

  # ──────────────────────────────────────────────
  # MinIO bucket initialization
  # ──────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: school-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
        mc mb local/$${AWS_BUCKET:-school} --ignore-existing;
        mc anonymous set download local/$${AWS_BUCKET:-school}/public;
        exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_BUCKET: ${AWS_BUCKET:-school}
    networks:
      - school-network

# ──────────────────────────────────────────────
# Volumes
# ──────────────────────────────────────────────
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  meilisearch-data:
    driver: local
  minio-data:
    driver: local
  app-storage:
    driver: local

# ──────────────────────────────────────────────
# Networks
# ──────────────────────────────────────────────
networks:
  school-network:
    driver: bridge
